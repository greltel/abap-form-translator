name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (abaplint)
        run: npm run lint

      - name: Transpile & run unit tests
        run: npm test

      # Fiori Elements sends one request per selected row unless the list
      # report button groups them into one change set. Unit tests cannot see
      # the metadata extension, so the annotation is guarded here.
      - name: Guard copyToLanguage change-set grouping
        run: |
          grep -q 'invocationGrouping: #CHANGE_SET' src/zc_form_trans_mde.ddlx.asddlxs
